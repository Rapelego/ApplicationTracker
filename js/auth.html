
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and computers -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | CareerTrack</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Authentication page styling -->
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <main class="auth-container">

        <!-- Brand section -->
        <section class="auth-brand">
            <h1>CareerTrack</h1>
            <p>Take control of your career journey.</p>
        </section>

        <!-- Authentication form section -->
        <section class="auth-card">

            <h2>Welcome back</h2>
            <p class="auth-subtitle">Sign in to manage your job applications.</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Sign In
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="#" id="showSignup">Create account</a>
            </p>

            <!-- Displays login or registration messages -->
            <p id="authMessage" aria-live="polite"></p>

        </section>

    </main>

    <!-- Supabase connection -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

</body>
</html>
