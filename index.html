<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Job Application Tracker</title>

  <meta
    name="description"
    content="Track job applications, interviews, and offers in one place."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <h1>Job Tracker</h1>
    <button id="darkToggle" aria-label="Toggle dark mode">🌙</button>
  </header>

  <!-- ===== Stats Overview ===== -->
  <section class="stats">
    <div class="stat-card">
      <span class="stat-number" id="totalJobs">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="appliedJobs">0</span>
      <span class="stat-label">Applied</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="interviewJobs">0</span>
      <span class="stat-label">Interviews</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="offerJobs">0</span>
      <span class="stat-label">Offers</span>
    </div>
  </section>

  <!-- ===== Add Job Form ===== -->
  <section class="add-job">
    <h2>Add Job Application</h2>

    <form id="jobForm">
      <div class="form-group">
        <label for="company">Company Name</label>
        <input type="text" id="company" required />
      </div>

      <div class="form-group">
        <label for="role">Job Title</label>
        <input type="text" id="role" required />
      </div>

      <div class="form-group">
        <label for="date">Application Date</label>
        <input type="date" id="date" required />
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" required>
          <option value="Applied">Applied</option>
          <option value="Interview">Interview</option>
          <option value="Offer">Offer</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" rows="3"></textarea>
      </div>

      <button type="submit" class="btn-primary">Add Job</button>
    </form>
  </section>

  <!-- ===== Filters ===== -->
  <section class="filters">
    <button data-filter="All" class="active">All</button>
    <button data-filter="Applied">Applied</button>
    <button data-filter="Interview">Interview</button>
    <button data-filter="Offer">Offer</button>
    <button data-filter="Rejected">Rejected</button>
  </section>

  <!-- ===== Job List ===== -->
  <section class="job-list">
    <h2>Applications</h2>

    <!-- Jobs will be injected here via JavaScript -->
    <div id="jobsContainer"></div>
    <p id="appMessage" aria-live="polite"></p>
  </section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/app.js"></script>

</body>
</html>
